# Image Classification API - CI/CD Pipeline

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Black
        run: black --check --diff . || true

      - name: Run isort
        run: isort --check-only --diff . || true

      - name: Run Flake8
        run: flake8 . --max-line-length=100 --ignore=E501,W503,E203 || true

  security:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          echo "Checking for potential secrets..."
          # Check for .pem files
          if find . -name "*.pem" -type f | grep -q .; then
            echo "❌ ERROR: .pem files found! These should not be committed."
            exit 1
          fi
          # Check for .env files (except .env.example)
          if find . -name ".env" -type f | grep -q .; then
            echo "❌ ERROR: .env file found! This should not be committed."
            exit 1
          fi
          echo "✅ No secrets found"

      - name: Run safety check
        run: |
          pip install safety
          safety check -r requirements.txt || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint, security]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt || true

      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml || echo "No tests found"
        env:
          DEVICE: cpu

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t image-classification-api:test .
          else
            echo "No Dockerfile found, skipping Docker build"
          fi
